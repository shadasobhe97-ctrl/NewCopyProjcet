<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحالة 7: بريد إلكتروني مسجل مسبقاً</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #ECEFF1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }
    /* Phone Shell Mockup */
    .phone-mockup {
      width: 412px;
      height: 935px;
      background: #FFFFFF;
      border-radius: 42px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18), 0 0 0 10px #1A1C1E;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Status Bar */
    .status-bar {
      height: 42px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      color: #1A1C1E;
      z-index: 10;
    }
    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    /* Top Bar */
    .app-bar {
      height: 44px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .back-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #1A1C1E;
    }
    /* Content Area */
    .content {
      flex: 1;
      padding: 4px 24px 34px 24px;
      display: flex;
      flex-direction: column;
    }
    /* Avatar Circle */
    .avatar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 14px;
    }
    .avatar-circle {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #E8F2FA;
      border: 2.5px solid #1D5997;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .avatar-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1D5997;
      border: 2.5px solid #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
    }
    .avatar-hint {
      margin-top: 6px;
      font-size: 11.5px;
      font-weight: 500;
      color: #757575;
    }
    /* Fields */
    .field-container {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }
    .field-box {
      border: 1.5px solid #E0E0E0;
      border-radius: 30px;
      padding: 5px 16px;
      background: #FFFFFF;
      position: relative;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .field-box.field-error {
      border-color: #E53935;
    }
    .field-label-floated {
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.2;
    }
    .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .field-prefix {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .field-value {
      flex: 1;
      font-size: 13.5px;
      font-weight: 600;
      color: #212121;
      min-height: 18px;
    }
    .field-value.pass-unmasked {
      letter-spacing: 1px;
    }
    .field-eye {
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .field-error-text {
      color: #E53935;
      font-size: 10.5px;
      font-weight: 600;
      margin-top: 3px;
      padding: 0 16px;
      line-height: 1.25;
    }
    /* Gender Chips */
    .gender-section {
      margin-bottom: 10px;
    }
    .gender-label {
      font-size: 12.5px;
      font-weight: 700;
      color: #212121;
      margin-bottom: 6px;
    }
    .chips-row {
      display: flex;
      gap: 12px;
    }
    .chip {
      flex: 1;
      height: 42px;
      border-radius: 21px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid #E0E0E0;
      background: #FFFFFF;
      color: #424242;
    }
    .chip.selected {
      background: #1D5997;
      color: #FFFFFF;
      border-color: #1D5997;
    }
    /* Submit Button */
    .submit-btn {
      height: 48px;
      border-radius: 24px;
      background: #1D5997;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(29, 89, 151, 0.25);
    }
    /* SnackBar */
    .snackbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 20px;
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 99;
    }
    .snackbar.error {
      background: #D32F2F;
    }
    .snackbar.success {
      background: #2E7D32;
    }
    /* Home Indicator */
    .home-indicator {
      width: 130px;
      height: 4px;
      background: #1A1C1E;
      border-radius: 2px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="phone-mockup">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>09:41</span>
      <div class="status-icons">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l.64-.64C7.93 20.26 9.88 21 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2 17h20v2H2zm1.15-4.05L4 11.92c3.02-1.97 6.47-3.01 10-3.01s6.98 1.04 10 3.01l.85 1.03C21.6 10.87 17.06 9.5 12 9.5s-9.6 1.37-12.85 3.45zM6 8.5C7.8 7.37 9.87 6.75 12 6.75s4.2.62 6 1.75l.9-1.2C16.8 5.86 14.47 5.25 12 5.25S7.2 5.86 5.1 7.3l.9 1.2z"/></svg>
        <svg width="22" height="12" viewBox="0 0 24 12" fill="currentColor"><rect x="1" y="1" width="19" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="3" width="13" height="6" rx="1.5"/><path d="M22 4.5v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>

    <!-- App Bar -->
    <div class="app-bar">
      <div class="back-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>
      <div></div>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Avatar Picker -->
      <div class="avatar-wrapper">
        <div class="avatar-circle">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="#1D5997">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <div class="avatar-badge">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </div>
        </div>
        <div class="avatar-hint">أضف صورة شخصية (اختياري)</div>
      </div>

      <!-- 1. Full Name -->
      
      <div class="field-container">
        <div class="field-box ">
          <div class="field-label-floated" style="color: #757575">الاسم الكامل (الثلاثي بالعربي)</div>
          <div class="field-row" style="direction: rtl">
            
            <div class="field-value " style="text-align: right">
              شذى صبحي بكار
            </div>
            <div class="field-prefix"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
          </div>
        </div>
        
      </div>
    

      <!-- 2. Email -->
      
      <div class="field-container">
        <div class="field-box ">
          <div class="field-label-floated" style="color: #757575">البريد الإلكتروني</div>
          <div class="field-row" style="direction: ltr">
            
            <div class="field-value " style="text-align: left">
              driver1@darby.ly
            </div>
            <div class="field-prefix"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></div>
          </div>
        </div>
        
      </div>
    

      <!-- 3. Phone -->
      
      <div class="field-container">
        <div class="field-box ">
          <div class="field-label-floated" style="color: #757575">رقم الهاتف</div>
          <div class="field-row" style="direction: ltr">
            
            <div class="field-value " style="text-align: left">
              0911234567
            </div>
            <div class="field-prefix"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><path d="M12 18h.01"></path></svg></div>
          </div>
        </div>
        
      </div>
    

      <!-- 4. Alt Phone -->
      
      <div class="field-container">
        <div class="field-box ">
          <div class="field-label-floated" style="color: #757575">رقم هاتف بديل/الطوارئ (اختياري)</div>
          <div class="field-row" style="direction: ltr">
            
            <div class="field-value " style="text-align: left">
              
            </div>
            <div class="field-prefix"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></div>
          </div>
        </div>
        
      </div>
    

      <!-- 5. Gender -->
      <div class="gender-section">
        <div class="gender-label">الجنس</div>
        <div class="chips-row">
          <div class="chip ">
            
            <span>ذكر</span>
          </div>
          <div class="chip selected">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>أنثى</span>
          </div>
        </div>
      </div>

      <!-- 6. Password -->
      
      <div class="field-container">
        <div class="field-box ">
          <div class="field-label-floated" style="color: #757575">كلمة المرور</div>
          <div class="field-row" style="direction: ltr">
            <div class="field-eye"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" x2="22" y1="2" y2="22"></line></svg></div>
            <div class="field-value " style="text-align: left">
              ••••••••
            </div>
            <div class="field-prefix"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
          </div>
        </div>
        
      </div>
    

      <!-- 7. Confirm Password -->
      
      <div class="field-container">
        <div class="field-box ">
          <div class="field-label-floated" style="color: #757575">تأكيد كلمة المرور</div>
          <div class="field-row" style="direction: ltr">
            <div class="field-eye"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" x2="22" y1="2" y2="22"></line></svg></div>
            <div class="field-value " style="text-align: left">
              ••••••••
            </div>
            <div class="field-prefix"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></div>
          </div>
        </div>
        
      </div>
    

      <!-- Submit Button -->
      <button class="submit-btn">إرسال رمز التحقق (OTP)</button>
    </div>

    <!-- SnackBar if present -->
    <div class="snackbar error">البريد الإلكتروني مسجل بالفعل، يرجى استخدام بريد آخر</div>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>
  </div>
</body>
</html>
